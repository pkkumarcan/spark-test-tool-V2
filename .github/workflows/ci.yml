name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff check
        run: ruff check apps/ packages/ tests/
      - name: Run ruff format check
        run: ruff format --check apps/ packages/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic pydantic-settings asyncpg httpx
      - name: Run mypy
        run: mypy packages/ apps/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
      - name: Run golden trajectory tests
        run: pytest tests/golden_trajectories/ -v --tb=short
      - name: Run sandbox escape tests
        run: pytest tests/sandbox_escape/ -v --tb=short
      - name: Run all tests with coverage
        run: pytest tests/ -v --tb=short --cov=packages --cov=apps --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/spark_test
          WORKSPACE_ROOT: /tmp/spark-test-workspace

  sandbox-escape:
    name: Sandbox Escape Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run sandbox escape policy tests
        run: pytest tests/sandbox_escape/ -v --tb=short -m "not slow"
      - name: Build sandbox test container
        run: docker build -f tests/sandbox_escape/Dockerfile.test-sandbox -t spark-sandbox-test .
        continue-on-error: true
      - name: Run container escape tests
        run: |
          docker run --rm --network=none --read-only \
            --tmpfs /tmp:size=10M \
            -v ${{ github.workspace }}:/workspace:ro \
            spark-sandbox-test \
            python3 -c "
          import subprocess, sys
          tests = [
              ('curl http://evil.com', 'network'),
              ('wget http://evil.com', 'network'),
              ('cat /etc/passwd', 'filesystem'),
          ]
          for cmd, category in tests:
              try:
                  r = subprocess.run(cmd.split(), capture_output=True, timeout=5)
                  if r.returncode == 0:
                      print(f'WARNING: {category} escape possible with: {cmd}')
                      sys.exit(1)
                  else:
                      print(f'BLOCKED: {category} - {cmd}')
              except Exception as e:
                  print(f'BLOCKED: {category} - {cmd} ({e})')
          print('All escape patterns blocked.')
          "
        continue-on-error: true
